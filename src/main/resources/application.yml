spring:
  application:
    name: corporate-admin
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  thymeleaf:
    encoding: UTF-8
server:
  port: ${PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
