<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Пользователи')}"></head>
<body>
<aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>
<div class="app-shell">
<header th:replace="~{fragments/layout :: topbar('Пользователи')}"></header>
<main id="main" class="content">
  <h1>Пользователи</h1>
  <div th:replace="~{fragments/layout :: messages}"></div>
  <p sec:authorize="hasAuthority('USER_WRITE')"><a th:href="@{/users/new}">Добавить пользователя</a></p>
  <form th:action="@{/users}" method="get" class="search-form" role="search">
    <label for="q">Поиск по логину, имени или email:</label>
    <input id="q" name="q" th:value="${q}" maxlength="100" type="search">
    <button type="submit">Найти</button>
    <a th:if="${q != null and !#strings.isEmpty(q)}" th:href="@{/users}">Сбросить</a>
  </form>
  <p>Найдено пользователей: <span th:text="${#lists.size(users)}">0</span></p>
  <div class="table-scroll" th:if="${!#lists.isEmpty(users)}">
    <table>
      <thead><tr><th scope="col">Логин</th><th scope="col">Имя</th><th scope="col">Email</th><th scope="col">Роли</th><th scope="col">Статус</th><th scope="col">Дата создания</th><th scope="col" sec:authorize="hasAuthority('USER_WRITE')">Действия</th></tr></thead>
      <tbody>
      <tr th:each="user : ${users}">
        <td th:text="${user.username}">login</td>
        <td th:text="${user.fullName}">Имя пользователя</td>
        <td th:text="${user.email}">email</td>
        <td><span th:each="role, loop : ${user.roles}"><span th:text="${role.name}">ROLE</span><span th:if="${!loop.last}">, </span></span><span th:if="${#sets.isEmpty(user.roles)}">Нет ролей</span></td>
        <td th:text="${user.enabled} ? 'Активен' : 'Отключён'">Активен</td>
        <td th:text="${#temporals.format(user.createdAt.atZone(T(java.time.ZoneId).of('Europe/Moscow')), 'dd.MM.yyyy')}">01.01.2026</td>
        <td sec:authorize="hasAuthority('USER_WRITE')"><a th:href="@{/users/{id}/edit(id=${user.id})}" th:attr="aria-label=${'Редактировать пользователя ' + user.username}">Изменить</a></td>
      </tr>
      </tbody>
    </table>
  </div>
  <p th:if="${#lists.isEmpty(users)}">Пользователи не найдены.</p>
  <p class="muted" sec:authorize="hasAuthority('USER_WRITE')">Чтобы отключить вход пользователя, измените статус в его форме.</p>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</div>
</body>
</html>
